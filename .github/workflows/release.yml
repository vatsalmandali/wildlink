# Builds the Windows installer and the Mac app, then publishes them as a GitHub
# release. Everyone running Wild Link sees the update within six hours.
#
# To release: bump the version in main.go, installer.nsi and Info.plist.mac,
# commit, then push a tag:   git tag v2.1.0 && git push origin v2.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install NSIS (builds the Windows installer)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Check the version in the tag matches the code
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go)
          echo "tag=$TAG code=$CODE"
          if [ -n "$TAG" ] && [ "$TAG" != "$CODE" ]; then
            echo "::error::Tag $TAG does not match appVersion $CODE in main.go"; exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build Windows installer
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.defaultUpdateURL=${{ github.repository }}" \
            -o WildLink.exe .
          makensis -V2 installer.nsi

      - name: Build Mac app
        run: |
          APP=WildLink.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.defaultUpdateURL=${{ github.repository }}" \
              -o "$APP/MacOS/wildlink-$arch" .
          done
          cp mac-launcher.sh "$APP/MacOS/WildLink"
          cp Info.plist.mac "$APP/Info.plist"
          cp wildlink.icns "$APP/Resources/"
          chmod 755 "$APP/MacOS/"*
          zip -qry WildLink-mac.zip WildLink.app

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Wild Link ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            WildLink-Setup.exe
            WildLink-mac.zip
